<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geração Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1f2937;
            --panel-color: #ffffff;
            --panel-soft: #f1f3f5;
            --border-color: rgba(15, 23, 42, 0.12);
            --btn-color: #0d6efd;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.theme-dark {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --panel-color: #111827;
            --panel-soft: #1f2937;
            --border-color: rgba(148, 163, 184, 0.25);
            --btn-color: #60a5fa;
        }

        body.theme-half-dark {
            --bg-color: #1f2937;
            --text-color: #e5e7eb;
            --panel-color: #2b3748;
            --panel-soft: #374151;
            --border-color: rgba(148, 163, 184, 0.2);
            --btn-color: #93c5fd;
        }

        .navbar,
        .dropdown-menu,
        .form-control,
        .btn,
        .dropdown-item {
            transition: all 0.3s ease;
        }

        .custom-theme {
            background-color: var(--panel-color);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .navbar {
            background-color: var(--panel-color) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar .nav-link,
        .navbar .navbar-brand,
        .navbar .dropdown-toggle,
        .navbar .nav-link.active {
            color: var(--text-color) !important;
        }

        .dropdown-menu {
            background-color: var(--panel-color);
            border-color: var(--border-color);
        }

        .dropdown-item {
            color: var(--text-color);
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background-color: var(--panel-soft);
            color: var(--text-color);
        }

        .form-control {
            background-color: var(--panel-soft);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .form-control::placeholder {
            color: rgba(148, 163, 184, 0.9);
        }

        .theme-selector .btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            background-color: var(--panel-soft);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
            transition: all 0.3s ease;
        }

        .theme-selector .btn:hover {
            transform: scale(1.04);
        }

        .theme-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            position: relative;
        }

        .theme-icon.sun {
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.2);
        }

        .theme-icon.sun::before,
        .theme-icon.sun::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(245, 158, 11, 0.7);
        }

        .theme-icon.sun::after {
            inset: -15px;
            border-color: rgba(245, 158, 11, 0.4);
        }

        .theme-icon.moon {
            border-radius: 50%;
            background: #e2e8f0;
            box-shadow: inset -8px 0 0 rgba(148, 163, 184, 0.8);
        }

        .theme-icon.star {
            width: 26px;
            height: 26px;
            background: transparent;
        }

        .theme-icon.star::before,
        .theme-icon.star::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            clip-path: polygon(50% 0%, 60% 38%, 100% 50%, 60% 62%, 50% 100%, 40% 62%, 0% 50%, 40% 38%);
        }

        .theme-icon.star::after {
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Geração Tech</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">1.0</a></li>
                            <li><a class="dropdown-item" href="#">2.0</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Fale com a coordenação</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2 theme-selector">
                    <button type="button" id="themeButton" class="btn" aria-label="Alternar tema do site">
                        <span id="themeIcon" class="theme-icon sun" aria-hidden="true"></span>
                    </button>
                </div>

                <form class="d-flex ms-3" role="search">
                    <input class="form-control me-2" type="search" placeholder="Digite sua pesquisa" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Procurar</button>
                </form>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const themeButton = document.getElementById('themeButton');
        const themeIcon = document.getElementById('themeIcon');
        const themes = ['light', 'dark', 'half-dark'];
        let currentThemeIndex = 0;

        function applyTheme(theme) {
            document.body.classList.remove('theme-dark', 'theme-half-dark');

            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            } else if (theme === 'half-dark') {
                document.body.classList.add('theme-half-dark');
            }

            themeIcon.classList.remove('sun', 'moon', 'star');

            if (theme === 'light') {
                themeIcon.classList.add('sun');
                themeButton.title = 'Modo claro';
            } else if (theme === 'dark') {
                themeIcon.classList.add('moon');
                themeButton.title = 'Modo escuro';
            } else {
                themeIcon.classList.add('star');
                themeButton.title = 'Modo meio escuro';
            }
        }

        themeButton.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
        });

        applyTheme(themes[currentThemeIndex]);
    </script>
</body>
</html>
